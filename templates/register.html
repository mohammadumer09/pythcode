{% extends "base.html" %}
{% block title %}Sign Up — pythcode{% endblock %}

{% block content %}
<section class="section" aria-labelledby="regHeading">
  <div class="container" style="max-width:420px">
    <div class="card">
      <h1 id="regHeading" style="font-size:1.5rem;margin-bottom:0.25rem">
        Create your <span class="accent-word">account</span>
      </h1>
      <p class="text-muted mb-3" style="font-size:0.88rem">Free. No credit card. Start learning instantly.</p>

      <div id="regError" class="challenge-feedback wrong" style="display:none;margin-bottom:1rem"></div>

      <form id="regForm" novalidate>
        <div style="margin-bottom:1rem">
          <label for="name" style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.4rem">Your name</label>
          <input type="text" id="name" name="name" required
                 class="text-input" style="width:100%" placeholder="Alice" autocomplete="name" />
        </div>
        <div style="margin-bottom:1rem">
          <label for="email" style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.4rem">Email</label>
          <input type="email" id="email" name="email" required
                 class="text-input" style="width:100%" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div style="margin-bottom:1.5rem">
          <label for="password" style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.4rem">Password <span class="text-muted">(min 6 characters)</span></label>
          <input type="password" id="password" name="password" required minlength="6"
                 class="text-input" style="width:100%" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="regBtn">Create account →</button>
      </form>

      <hr style="border-color:var(--border);margin:1.5rem 0">

      <button class="btn btn-secondary" style="width:100%" onclick="continueAsGuest()">
        Continue as guest
      </button>

      <p class="text-muted text-center mt-2" style="font-size:0.82rem">
        Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent)">Log in →</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lesson.css') }}" />
<script>
document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn   = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Creating account…';
  const errEl  = document.getElementById('regError');
  errEl.style.display = 'none';

  const body = {
    name:     document.getElementById('name').value,
    email:    document.getElementById('email').value,
    password: document.getElementById('password').value,
  };

  try {
    const res  = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Registration failed.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create account →';
      return;
    }
    if (data.confirmation_required) {
      errEl.textContent = data.message || 'Check your email to confirm your account, then log in.';
      errEl.classList.remove('wrong');
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create account →';
      return;
    }
    // Merge any guest progress
    const raw = localStorage.getItem('pc_guest_progress');
    if (raw) {
      try {
        const progress = JSON.parse(raw);
        await fetch('/api/merge-guest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ progress }) });
        localStorage.removeItem('pc_guest_progress');
        localStorage.removeItem('pc_guest');
      } catch {}
    }
    window.location.href = '/map';
  } catch {
    errEl.textContent = 'Could not connect. Try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create account →';
  }
});

function continueAsGuest() {
  localStorage.setItem('pc_guest', '1');
  window.location.href = '/map';
}
</script>
{% endblock %}
