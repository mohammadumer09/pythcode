{% extends "base.html" %}
{% block title %}Login — pythcode{% endblock %}

{% block content %}
<section class="section" aria-labelledby="loginHeading">
  <div class="container" style="max-width:420px">
    <div class="card">
      <h1 id="loginHeading" style="font-size:1.5rem;margin-bottom:0.25rem">
        Welcome <span class="accent-word">back</span>
      </h1>
      <p class="text-muted mb-3" style="font-size:0.88rem">Log in to continue your progress.</p>

      <div id="loginError" class="challenge-feedback wrong" style="display:none;margin-bottom:1rem"></div>

      <form id="loginForm" novalidate>
        <div style="margin-bottom:1rem">
          <label for="email" style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.4rem">Email</label>
          <input type="email" id="email" name="email" required
                 class="text-input" style="width:100%" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div style="margin-bottom:1.5rem">
          <label for="password" style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:0.4rem">Password</label>
          <input type="password" id="password" name="password" required
                 class="text-input" style="width:100%" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">Log in →</button>
      </form>

      <hr style="border-color:var(--border);margin:1.5rem 0">

      <button class="btn btn-secondary" style="width:100%" onclick="continueAsGuest()">
        Continue as guest
      </button>

      <p class="text-muted text-center mt-2" style="font-size:0.82rem">
        No account? <a href="{{ url_for('register') }}" style="color:var(--accent)">Sign up free →</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lesson.css') }}" />
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  const body = {
    email:    document.getElementById('email').value,
    password: document.getElementById('password').value,
  };

  try {
    const res  = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Login failed.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Log in →';
      return;
    }
    // Merge guest progress if any
    await mergeGuestProgress();
    window.location.href = '/map';
  } catch {
    errEl.textContent = 'Could not connect. Try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log in →';
  }
});

async function mergeGuestProgress() {
  const raw = localStorage.getItem('pc_guest_progress');
  if (!raw) return;
  try {
    const progress = JSON.parse(raw);
    await fetch('/api/merge-guest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ progress }) });
    localStorage.removeItem('pc_guest_progress');
  } catch {}
}

function continueAsGuest() {
  localStorage.setItem('pc_guest', '1');
  window.location.href = '/map';
}
</script>
{% endblock %}
